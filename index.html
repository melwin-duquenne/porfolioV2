    <meta name="theme-color" content="" />
    <script>
      // Thème posé avant le premier rendu (pas de flash) : choix fait pendant
      // cette visite, sinon l'heure du visiteur (nuit de 20 h à 7 h).
      // Voir src/composables/useTheme.js.
      ;(function () {
        var t
        try {
          t = sessionStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          var h = new Date().getHours()
          t = h >= 20 || h < 7 ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
